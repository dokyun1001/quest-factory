# Builds the web demo and publishes it to the gh-pages branch (GitHub Pages).
# The art lives in the PRIVATE repo dokyun1001/quest-factory-assets, so this needs a
# repository secret ASSETS_TOKEN (fine-grained token, read-only "Contents" on that repo).
# Without the secret the workflow does nothing and reports why (no failure).
name: Deploy web demo

on:
  push:
    branches: [main]
    paths: ['web/**', 'tools/pack_web_assets.py', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check assets token
        id: token
        env:
          ASSETS_TOKEN: ${{ secrets.ASSETS_TOKEN }}
        run: |
          if [ -z "$ASSETS_TOKEN" ]; then
            echo "::notice::ASSETS_TOKEN secret is not set; skipping build. See docs/DEPLOY.md."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'

      - name: Fetch private assets
        if: steps.token.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          repository: dokyun1001/quest-factory-assets
          token: ${{ secrets.ASSETS_TOKEN }}
          path: assets

      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-python@v5
        if: steps.token.outputs.ok == 'true'
        with:
          python-version: '3.12'

      - name: Build
        if: steps.token.outputs.ok == 'true'
        working-directory: web
        run: |
          pip install pillow==11.0.0
          npm ci
          npm run build

      - name: Publish to gh-pages
        if: steps.token.outputs.ok == 'true'
        run: |
          cd web/dist
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Deploy web demo from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
