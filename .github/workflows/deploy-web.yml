# QUEST FACTORY 006 — builds the new web test build and publishes it to the gh-pages branch.
# Art comes ONLY from QUEST_FACTORY_DEV_RESTART_006.zip in the PRIVATE repo
# dokyun1001/quest-factory-assets (secret ASSETS_TOKEN, read-only). Legacy asset folders are never read.
# gh-pages is updated with a normal (non-force) commit so every previous deployment stays recoverable.
name: Deploy web build (006)

on:
  push:
    branches: [main]
    paths: ['web/**', 'tools/**', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check assets token
        id: token
        env:
          ASSETS_TOKEN: ${{ secrets.ASSETS_TOKEN }}
        run: |
          if [ -z "$ASSETS_TOKEN" ]; then
            echo "::notice::ASSETS_TOKEN secret is not set; skipping build. See docs/DEPLOY.md."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'

      - name: Fetch approved asset package (private)
        if: steps.token.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          repository: dokyun1001/quest-factory-assets
          token: ${{ secrets.ASSETS_TOKEN }}
          path: assets

      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-python@v5
        if: steps.token.outputs.ok == 'true'
        with:
          python-version: '3.12'

      - name: Build (pack 006 atlas -> vite build -> legacy asset check)
        if: steps.token.outputs.ok == 'true'
        working-directory: web
        run: |
          pip install pillow==11.0.0
          npm ci
          node test/sim.test.mjs
          npm run build

      - name: Publish to gh-pages (normal commit, no force)
        if: steps.token.outputs.ok == 'true'
        run: |
          git clone --depth 1 --branch gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" pages
          cd pages
          git rm -rq --ignore-unmatch .
          cp -r ../web/dist/. .
          touch .nojekyll
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Deploy 006 web build from ${GITHUB_SHA::7}" || { echo "No changes"; exit 0; }
          git push origin gh-pages
